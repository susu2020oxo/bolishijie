plugins {
    id 'fabric-loom' version '1.13.6'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        bolishijie {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'bolishijie-test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.register('checkResources', Exec) {
    commandLine 'python3', 'tools/check_resources.py'
}
check.dependsOn checkResources

// Uses the remapped, distributable JAR and Fabric's production server launcher.
tasks.register('runProductionSmokeServer', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    installerVersion = '1.0.1'
    runDir = layout.buildDirectory.dir('production-smoke')
    jvmArgs.addAll('-Xms512M', '-Xmx2G')
}
